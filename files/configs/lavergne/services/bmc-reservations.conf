# Lavergne mgmt (vid 4) DHCP pins (spec 2026-10-27 §6.1, operator layout 2026-10-27).
# MACs from bang-rhythm's legacy /etc/dhcpd.d/mgmt. Kea site: dnsmasq does NOT
# load this file; it is imported into kea.hosts once at the Kea cutover with
#   python -m flax_classify.legacy_import import <this file>
# (rows tagged source=legacy-import, never evicted by the materializer).
#
# Switch BMCs (OpenBMC keeps no IP config across reboots):
dhcp-host=3c:2c:99:69:4a:e7,192.168.88.11,rabbit-rhythm-bmc,set:bmc
dhcp-host=3c:2c:99:60:d3:37,192.168.88.12,rabbit-blues-bmc,set:bmc
dhcp-host=98:19:2c:3a:95:79,192.168.88.13,rabbit-howlin-bmc,set:bmc
dhcp-host=b8:6a:97:fd:20:66,192.168.88.14,rabbit-c2g-bmc,set:bmc
dhcp-host=80:a2:35:d2:cd:c4,192.168.88.15,rabbit-muddy-bmc,set:bmc
dhcp-host=3c:2c:99:3c:73:d5,192.168.88.16,rabbit-cato-bmc,set:bmc
