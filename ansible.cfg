[defaults]
vault_password_file  = scripts/vault-password.sh
use_tty              = False
roles_path           = roles
library              = library
filter_plugins       = filter_plugins
collections_path     = ~/.ansible.collections
host_key_checking    = False
deprecation_warnings = False
stdout_callback      = ansible.builtin.default
result_format        = yaml
gathering            = explicit
interpreter_python   = auto_silent

[ssh_connection]
ssh_args     = -o ControlMaster=auto -o ControlPersist=60s
pipelining   = True

[paramiko_connection]
# Only network_cli hosts with ansible_network_cli_ssh_type: paramiko use this (the
# eindhoven IOS 15 turtle). Offering a key first makes IOS 15.2 drop the session
# ("expected packet type 50, got 5") before password auth is tried.
look_for_keys = False
