---
# Names of firewalld zones / policies; rarely overridden.
apply_bang_router_lab_zone: lab-data
apply_bang_router_lab_policy: lab-to-corp
# masq: internal->external forwarding policy. openSUSE shipped this
# behaviour by default before 15.6; we recreate it explicitly here.
apply_bang_router_masq_policy: masq
# WAN default-route metric guard (bang-wan-route-guard): "IFACE:METRIC" pairs
# kept at their metric every minute. Empty = not installed (and removed).
# wicked drops DHCLIENT_ROUTE_PRIORITY on a re-created hotplug device
# (lavergne wlan0 replug 2026-10-28), so set it where a backup WAN is hotplug.
apply_bang_router_wan_route_metrics: []
