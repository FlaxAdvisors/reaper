---
- name: Reload systemd
  become: true
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart flax-reconcile
  # VIP-gated unit: ExecStartPre refuses to start on the standby, so a restart
  # there can only fail the play. Deploy the files, restart on the VIP holder.
  when: apply_flax_stack_is_primary | default(true) | bool
  become: true
  ansible.builtin.systemd:
    name: flax-reconcile.service
    state: restarted

- name: Reload firewalld
  become: true
  ansible.builtin.command:
    cmd: firewall-cmd --reload
  changed_when: true
