---
# rackpost order server. Layout under {{ apply_rackpost_dest_dir }} mirrors the
# repo so flax_rack/server.py finds flax_post/web/static relative to itself.
# Plain copy, NOT template: the code carries literal braces.

# Drain first: while /run/flax-rackpost.drain exists the daemon refuses to start a
# stage or a Close, so nothing starts between the idle check below and the restart
# at the end (a restart mid-stage killed two operator runs on 2026-10-30).
- name: Drain flax-rackpost (no new stages until the restart)
  become: true
  ansible.builtin.file:
    path: /run/flax-rackpost.drain
    state: touch
    mode: "0644"

- name: Refuse to restart under a running stage
  become: true
  ansible.builtin.shell: |
    python3 - <<'PY'
    import json, sys, urllib.request
    base = "http://127.0.0.1:{{ apply_rackpost_port }}"
    try:
        ix = json.load(urllib.request.urlopen(base + "/rackpost/api/racks", timeout=10))
    except OSError:
        sys.exit(0)                     # daemon not up: nothing to interrupt
    busy = []
    for o in ix["orders"]:
        for r in o["racks"]:
            s = json.load(urllib.request.urlopen(f"{base}/{r['prefix']}/api/state", timeout=10))
            if s.get("stage_running"):
                busy.append(f"{r['prefix']}: {s.get('stage') or 'cli'}")
    print("; ".join(busy))
    sys.exit(3 if busy else 0)
    PY
  register: apply_rackpost_busy
  changed_when: false
  failed_when: false
  when: not (apply_rackpost_restart_busy | default(false) | bool)

- name: Undrain and stop when a stage is running
  when: apply_rackpost_busy.rc is defined and apply_rackpost_busy.rc == 3
  block:
    - name: Undrain flax-rackpost
      become: true
      ansible.builtin.file:
        path: /run/flax-rackpost.drain
        state: absent
    - name: Stop
      ansible.builtin.fail:
        msg: "a stage is running ({{ apply_rackpost_busy.stdout }}); re-run when idle, or -e apply_rackpost_restart_busy=true"

- name: Create rackpost directories
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /opt/flax/bin
    - "{{ apply_rackpost_dest_dir }}"
    - "{{ apply_rackpost_dest_dir }}/flax_post"
    - "{{ apply_rackpost_dest_dir }}/flax_post/observe"
    - "{{ apply_rackpost_dest_dir }}/flax_post/fwd"
    - "{{ apply_rackpost_dest_dir }}/flax_post/biosd"
    - "{{ apply_rackpost_dest_dir }}/flax_post/nicd"
    - "{{ apply_rackpost_dest_dir }}/flax_post/web"
    - "{{ apply_rackpost_dest_dir }}/flax_post/web/static"

- name: Deploy flax_rack and flax_rungs
  become: true
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../{{ item }}/"
    dest: "{{ apply_rackpost_dest_dir }}/{{ item }}/"
    owner: root
    group: root
    mode: preserve
  loop:
    - flax_rack
    - flax_rungs
  notify: Restart flax-rackpost

- name: Deploy shared flax_post static files
  become: true
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../flax_post/web/static/{{ item }}"
    dest: "{{ apply_rackpost_dest_dir }}/flax_post/web/static/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ apply_rackpost_post_static }}"
  notify: Restart flax-rackpost

- name: Deploy shared flax_post modules
  become: true
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../flax_post/{{ item }}"
    dest: "{{ apply_rackpost_dest_dir }}/flax_post/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ apply_rackpost_post_modules }}"
  notify: Restart flax-rackpost

- name: Install rackpost wrapper
  become: true
  ansible.builtin.template:
    src: rackpost.sh.j2
    dest: "{{ apply_rackpost_wrapper }}"
    owner: root
    group: root
    mode: "0755"

# Only the BOM importer needs it; the daemon is stdlib.
# Vendored under the deploy dir (not root's --user site) so `rackpost import-bom`
# works for any operator, not only root; the wrapper puts vendor/ on PYTHONPATH.
- name: Install openpyxl for import-bom
  become: true
  ansible.builtin.pip:
    name: openpyxl
    executable: pip3.11
    extra_args: "--target {{ apply_rackpost_dest_dir }}/vendor"

- name: Deploy flax-rackpost systemd unit
  become: true
  ansible.builtin.template:
    src: flax-rackpost.service.j2
    dest: /etc/systemd/system/flax-rackpost.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart flax-rackpost

- name: Enable + start flax-rackpost
  become: true
  ansible.builtin.systemd:
    name: flax-rackpost
    enabled: true
    state: started
    daemon_reload: true

- name: Restart now (handlers) so the drain covers it
  ansible.builtin.meta: flush_handlers

- name: Undrain flax-rackpost
  become: true
  ansible.builtin.file:
    path: /run/flax-rackpost.drain
    state: absent
