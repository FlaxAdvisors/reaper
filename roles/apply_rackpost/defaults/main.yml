---
# Order server for customer racks. Loopback-only: reached via the post.* nginx
# vhosts (apply_bang_services nginx-lab-ui + apply_flax_stack TLS vhost).
apply_rackpost_bind: 127.0.0.1
apply_rackpost_port: 8452
apply_rackpost_root: /export/nodes
apply_rackpost_dest_dir: /opt/flax/rackpost
apply_rackpost_wrapper: /opt/flax/bin/rackpost
# flax_rack needs python >= 3.7; bang-gouda's system python3 is 3.6.
apply_rackpost_python: python3.11
# Only these flax_post static files are shared with the post rack viewer.
apply_rackpost_post_static:
  - rack.css
  - petite-vue.iife.js
  - flax-logo.svg
# flax_post modules the Qualify rungs import: the population judge, the qual
# client, and Post's own Qualify judges (qualify_rules -> blocklist, shipchecks;
# FRU 0 via observe/fru + the family map); the loose-node firmware detectors'
# manifest/classify/driver modules (fwd, biosd, nicd, plus what they import) and
# the IP-keyed boot evidence (observe/bootlog). All stdlib: never a module that
# pulls psycopg (blades, observe/host_qual, observe/ladder, stepinfo, db, state)
# or a daemon entry (service, bridge, store, __main__).
apply_rackpost_post_modules:
  - __init__.py
  - version.py
  - population.py
  - qualclient.py
  - qualify_rules.py
  - shipchecks.py
  - blocklist.py
  - observe/__init__.py
  - observe/fru.py
  - observe/family_map.py
  - observe/family_map_live.py
  - observe/bootlog.py
  - fwd/__init__.py
  - fwd/version.py
  - fwd/manifest.py
  - fwd/redfish.py
  - fwd/entity_cache.py
  - fwd/flasher.py
  - fwd/enforce.py
  - fwd/creds.py
  - biosd/__init__.py
  - biosd/version.py
  - biosd/classify.py
  - biosd/manifest.py
  - biosd/driver.py
  - biosd/creds.py
  - nicd/__init__.py
  - nicd/classify.py
  - nicd/manifest.py
  - nicd/driver.py
