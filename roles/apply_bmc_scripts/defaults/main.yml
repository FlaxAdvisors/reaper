---
# Destination for operator-callable BMC tools. /opt/flax/bin is the
# right home — these scripts reach BMCs via Redfish (curl) or SSH;
# they do not need local root on the bang to run, so they live
# alongside macsum/finddhcpack/soltriage rather than the daemon
# binaries in /opt/flax/sbin.
apply_bmc_scripts_dest_dir: /opt/flax/bin

# Source-to-destination map. Keep the rename here so the role itself
# stays trivially loop-driven and adding a new script is one line.
apply_bmc_scripts_files:
  - { src: bmc-reset-via-redfish.sh,      dest: bmc-reset-via-redfish }
  - { src: bmc-enable-inband-admin.sh.j2, dest: bmc-enable-inband-admin }
  - { src: bmc-backup-flash.sh.j2,        dest: bmc-backup-flash }
  - { src: bmc-clear-entity-cache.sh.j2,  dest: bmc-clear-entity-cache }
  - { src: bmc-bios-chip-probe.sh.j2,     dest: bmc-bios-chip-probe }
  - { src: bmc-blade-power-cycle.sh.j2,   dest: bmc-blade-power-cycle }
  - { src: bmc-boot-evidence.sh.j2,       dest: bmc-boot-evidence }
  - { src: bmc-thermtrip-probe.sh.j2,     dest: bmc-thermtrip-probe }
  - { src: fru_audit_post_vlan.sh.j2,     dest: fru_audit_post_vlan }
  # Firmware push bins (2026-09-24). bmc-fw-update REPLACES ghost's
  # playbooks/roles/utils/files/bin/bmc-fw-update (same interface; vaulted
  # credential; Redfish job interlock). bios-fw-update is new.
  - { src: bmc-fw-update.sh.j2,           dest: bmc-fw-update }
  - { src: bios-fw-update.sh.j2,          dest: bios-fw-update }

# Plain (non-templated) operator scripts -- no vault variables, so these
# must NOT go through the vault-templated apply_bmc_scripts_files loop
# above (see the "Deploy plain (non-templated) operator scripts" task).
apply_bmc_scripts_plain:
  - { src: bios_gate, dest: bios_gate }
