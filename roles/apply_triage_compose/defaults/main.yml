---
# System-level path: reaper deploy stages the triage repo's compose and the
# site .env here; keepalived's notify scripts read from the same path. /etc/flax/ is
# already used for site config (site.env, switches.json, etc.) and is
# not blocked by ProtectHome=true on keepalived.service.
apply_triage_compose_path: /etc/flax/triage
apply_triage_compose_compose_file: docker-compose-prod.yml
# Set by `reaper deploy <site> triage` only (a local dir of the fetched files);
# empty makes the role refuse.
apply_triage_compose_src: ""

# Compose project name. Must match the -p flag in apply_keepalived's
# notify_{master,backup,fault}.sh templates so master/backup transitions
# act on the same project regardless of compose `name:` field.
apply_triage_compose_project: prod
# Profile under /opt/flax/node_config the triage UI starts on when a bang has
# no settings.json yet. Empty = no seed (the UI starts with nothing selected).
apply_triage_compose_node_config: ""
