version: '3.5'

services:

  server:
    build:
      context: .
      dockerfile: monitor/server/Dockerfile
    command: npm run start
    # command: ["/bin/bash", "-c", "env | grep PORT && npm run start"]
    # PID 1 is `npm run start` (node), which does NOT reap orphaned children.
    # Each SOL session spawns bash -> soltriage -> ipmitool; on disconnect the
    # pty is killed and the grandchildren reparent to PID 1 and pile up as
    # <defunct> zombies (seen accumulating since Jun 23), churning BMC RMCP+
    # sessions. A real init (tini) reaps them. Same pattern as [ios_driver_ssh].
    init: true
    restart: always
    network_mode: host
    environment:
      - PORT=5559
    volumes:
      - /etc/flax/:/etc/flax/
      - /opt/flax/bin:/usr/local/sbin:ro

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    command: gunicorn --bind 0.0.0.0:5555 -w 3 manage:app
    # Same orphan-reaping need as bmc_fw/bios_fw/server above -- gunicorn's
    # master is PID 1 here and does not reap grandchildren on its own.
    init: true
    restart: always
    network_mode: host
    env_file:
      - ./.env_prod
    volumes:
      - /export/nodes:/export/nodes:ro
      - /etc/flax/:/etc/flax/
      - /opt/flax/bin:/usr/local/sbin:ro
      # Backup EEPROM refresh marker channel, shared with bmc_fw.
      - /run/flax/:/run/flax/
    environment:
      - VERSION=${version}
      # Plan 3.5: flax-control's /api/v1/{port,ports,rackous} replaces
      # switchportrecond's on :10988. Same shape; both are network_mode:host so
      # 127.0.0.1:8000 reaches the flax-control uvicorn directly (no TLS).
      - SWITCHPORTRECON_URL=http://localhost:8000
      # Marker directory shared with bmc_fw (Backup EEPROM on-demand refresh);
      # must match bmc_fw's BMC_BACKUP_REFRESH_DIR.
      - BMC_BACKUP_REFRESH_DIR=/run/flax/bmc-backup-refresh
      # mezz_flash: the mezzanine FW-unlock station agent. Zone A --
      # rabbit-gouda Et5 (left), Et9 (centre), Et27 (right), the top four OUs
      # of each column.
      #
      # THIS LIST MUST EQUAL THE ZONE A PART OF BMC_FW_DISABLE_PORTS AND
      # BIOS_FW_DISABLE_PORTS above. A station slot missing from those means
      # bmc_fw or bios_fw acts on a blade mid-unlock -- and with
      # BMC_FW_POWER_ON=true it can draw a power-on on a slot whose identity
      # changed because the card was swapped by hand.
      # reaper-devel tests/test_mezzflash_compose_ports.py enforces it.
      - MEZZ_FLASH_PORTS=et5b1,et5b2,et5b3,et5b4,et9b1,et9b2,et9b3,et9b4,et27b1,et27b2,et27b3,et27b4
      # A DIRECTORY, one JSON file per station blade. /etc/flax is already
      # bind-mounted whole, so this needs no new mount. NEVER bind-mount a
      # file from inside it into another container: this store writes with
      # os.replace, which changes the inode (see biosfw/store.py, which must
      # not use os.replace for exactly that reason).
      - MEZZ_FLASH_DB=/etc/flax/mezzflash

