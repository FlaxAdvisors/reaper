  # BMC firmware updater worker (Phase C). Master-only via the VIP-exclusive
  # triage stack. Ships SAFE: BMC_FW_MODE=detect reports needs_update per slot
  # and NEVER flashes. Stage 4 flips to enforce + a single-port allowlist.
  bmc_fw:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    command: python -m bmcfw.worker
    # PID 1 is the python worker, which does NOT reap orphaned children. The
    # fw bins' rf() passes the netrc as `--netrc-file <(printf ...)`; inside
    # `r=$(rf ...)` bash execs curl and the procsub child reparents to PID 1,
    # one <defunct> bmc-fw-update per Redfish call. 2026-09-25 that filled the
    # container's pids (8601), forks failed, `bmc-fw-update version` returned
    # "" with rc 0, and 12 Phosphor blades were latched target_mismatch (OEM).
    # A real init (tini) reaps them. Same pattern as server above.
    init: true
    restart: always
    network_mode: host
    env_file:
      - ./.env_prod
    volumes:
      - /etc/flax/:/etc/flax/
      - /run/flax/:/run/flax/
      - /opt/flax/bin:/usr/local/sbin:ro
    environment:
      - SWITCHPORTRECON_URL=http://localhost:8000
      - BMC_FW_BIN=/usr/local/sbin
      - BMC_FW_DB=/etc/flax/bmcfw.json
      - BMC_FW_MANIFEST=/etc/flax/bmc-firmware-versions.json
      - BMC_FW_SHARE_BASE=http://bang/export/share
      - BMC_FW_MODE=enforce
      - BMC_FW_ENABLE_PORTS=
      # Hard opt-out, outranks MODE and ENABLE_PORTS, and holds the host OFF too.
      # A station's card is swapped by hand, which changes the BMC MAC and so
      # the slot identity, and a slot read as new can draw a power-on under
      # POWER_ON=true + enforce.
      # Zone A (rabbit-gouda Et5 left, Et9 center, Et27 right; added to triage
      # 2026-09-21) is kept out of bmc_fw entirely.
      # et26b3 was the ORIGINAL station and was listed here until 2026-09-24,
      # when that blade moved into Zone A. The slot is back in normal triage
      # processing, so it is deliberately NOT excluded any more.
      - BMC_FW_DISABLE_PORTS=et5b1,et5b2,et5b3,et5b4,et9b1,et9b2,et9b3,et9b4,et27b1,et27b2,et27b3,et27b4
      - BMC_FW_POWER_ON=true
      # Backup EEPROM (spec 2026-09-01-bmc-backup-chip-design.md). The cache
      # holds ONE extracted image-bmc shared by every node; /run is a 13 GB
      # tmpfs on bang-gouda. The refresh dir is the api->worker marker channel.
      - BMC_BACKUP_CACHE=/run/flax/bmc-backup
      - BMC_BACKUP_REFRESH_DIR=/run/flax/bmc-backup-refresh

  bios_fw:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    command: python -m biosfw.worker
    # Same orphan-reaping need as bmc_fw above (bios-fw-update has the same rf()).
    init: true
    restart: always
    network_mode: host
    env_file:
      - ./.env_prod
    volumes:
      - /etc/flax/:/etc/flax/
      - /run/flax/:/run/flax/
      - /opt/flax/bin:/usr/local/sbin:ro
    environment:
      - SWITCHPORTRECON_URL=http://localhost:8000
      # Container-side override of the host-path default in
      # biosfw.worker.BIN -- must match the mount above's destination
      # (/usr/local/sbin), the same pattern bmc_fw uses for BMC_FW_BIN.
      - BIOS_FW_BIN=/usr/local/sbin
      - BIOS_FW_DB=/etc/flax/biosfw.json
      - BIOS_FW_MANIFEST=/etc/flax/host-firmware-versions.json
      - BIOS_FW_GATE_DIR=/run/flax/bios-fw-gate
      # Read-only cross-check into bmc_fw's own store (same file bmc_fw's
      # BMC_FW_DB above writes -- /etc/flax is mounted whole into this
      # container too) so biosfw can refuse to flash a node whose BMC
      # firmware bmc_fw has not yet brought to target. Explicit, not left to
      # the code default: see the BIOS_FW_BIN concern in
      # docs/superpowers/sdd/biosfw-bin-mount-report.md for why an
      # env-var-driven container path should never rely on a default match.
      - BMC_FW_DB=/etc/flax/bmcfw.json
      # Per-port power-on hold. /etc/flax, NOT /run: the gate is tmpfs so a
      # reboot re-blocks every node (fail-safe), but a hold released by a
      # reboot would power on the node an engineer is investigating. It must
      # outlive reboots -- do not move it to /run to match the gate.
      - BIOS_FW_HOLD_DIR=/etc/flax/bios-fw-hold
      - BIOS_FW_SHARE_BASE=http://bang/export/share
      # How stale the BMC-attested BIOS reading may get before it is re-read.
      # DECORATION ONLY -- it never gates a flash. Event-driven (never read, a
      # blade swap, post-flash) with this as the slow backstop, because these
      # BMCs have shown auth quirks and session exhaustion under polling.
      - BIOS_FW_BMC_TTL=3600
      - BIOS_FW_MODE=enforce
      # Fleet-wide power-on override, unchanged. The per-port hold is
      # additional, not a replacement for this.
      - BIOS_FW_POWER_ON=true
      # Staged bring-up (A.5.2): ONLY this port may be authorised. Every
      # other port stays blocked even if it reports a delta. Widen with a
      # glob (et10b*) or empty (= all) once the flash is proven on metal.
      - BIOS_FW_ENABLE_PORTS=
      # Hard opt-out, outranks MODE and ENABLE_PORTS. Nothing is touched on
      # these ports at all: no ACK (so post.sh never shuts one down), no
      # flash, no hold-release power-on, and no row on the page.
      # Zone A (rabbit-gouda Et5 left, Et9 center, Et27 right) is kept out
      # of bios_fw for the same reason it is kept out of bmc_fw, plus one
      # of its own: those breakouts may hold Tioga Pass blades serving as
      # NIC flashing stations, which the manifest DOES manage.
      # et26b3 dropped 2026-09-24 -- see bmc_fw above.
      # Globs are allowed here (et5b*); spelled out to match bmc_fw's line.
      - BIOS_FW_DISABLE_PORTS=et5b1,et5b2,et5b3,et5b4,et9b1,et9b2,et9b3,et9b4,et27b1,et27b2,et27b3,et27b4
      # Spec 2026-09-24 §3.4 / 09-23 §5.4 staging (O6: every new power path gets
      # one-port bring-up with an operator go). Empty = every port, - = none.
      - BIOS_FW_BOOTCHECK_PORTS=-
      - BIOS_FW_RECOVER_PORTS=-
      - BIOS_FW_RECOVER_CYCLE=true
      - BIOS_FW_SETTLE_S=420
      - BIOS_FW_GATE_ABSENT_S=420
