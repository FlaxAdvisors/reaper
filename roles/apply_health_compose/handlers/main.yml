---
- name: Reload firewalld
  become: true
  ansible.builtin.command:
    cmd: firewall-cmd --reload
  changed_when: true

- name: Reload prometheus
  become: true
  ansible.builtin.command:
    cmd: "docker compose -p {{ apply_health_compose_project }} exec -T prometheus killall -HUP prometheus"
    chdir: "{{ apply_health_compose_path }}"
  changed_when: true
  failed_when: false

- name: Reload alertmanager
  become: true
  ansible.builtin.command:
    cmd: "docker compose -p {{ apply_health_compose_project }} exec -T alertmanager killall -HUP alertmanager"
    chdir: "{{ apply_health_compose_path }}"
  changed_when: true
  failed_when: false

# snmp_exporter re-reads snmp.yml on SIGHUP; without it a new module/auth is ignored
# until the container restarts ("Unknown auth" at the eindhoven deploy, 2026-11-09)
- name: Reload snmp_exporter
  become: true
  ansible.builtin.command: docker kill --signal HUP prod-health-snmp_exporter-1
  failed_when: false

# Grafana reads datasource provisioning (and deleteDatasources) only at startup
- name: Restart grafana
  become: true
  ansible.builtin.command: docker restart prod-health-grafana-1
  failed_when: false
