---
# Lavergne (spec 2026-10-27-lavergne-eindhoven-rebuild). network_cli (libssh)
# bypasses ~/.ssh/config, so switches proxy explicitly through bang-rhythm, the
# only bang with tailscale today (bang-blues gets a new wifi adapter). Switch
# ansible_host values are the TARGET mgmt addresses (spec §6.1); until a switch
# has been re-IP'd, pass -e ansible_host=<old ip> for it.
all:
  hosts:
    localhost:
      ansible_connection: local
      ansible_python_interpreter: /usr/bin/python3
  children:
    arista:
      hosts:
        rabbit-rhythm:
          ansible_host: 192.168.88.31
          ansible_ssh_extra_args: "-o ProxyCommand='ssh -W %h:%p bang-rhythm'"
        rabbit-blues:
          ansible_host: 192.168.88.32
          ansible_ssh_extra_args: "-o ProxyCommand='ssh -W %h:%p bang-rhythm'"
        rabbit-howlin:
          ansible_host: 192.168.88.34
          ansible_ssh_extra_args: "-o ProxyCommand='ssh -W %h:%p bang-rhythm'"
        rabbit-c2g:
          ansible_host: 192.168.88.35
          ansible_ssh_extra_args: "-o ProxyCommand='ssh -W %h:%p bang-rhythm'"
        rabbit-muddy:
          ansible_host: 192.168.88.36
          ansible_ssh_extra_args: "-o ProxyCommand='ssh -W %h:%p bang-rhythm'"
    cumulus:
      hosts:
        turtle-rhythm:
          ansible_host: 192.168.88.33
          ansible_ssh_extra_args: "-o ProxyCommand='ssh -W %h:%p bang-rhythm'"
    jumphosts:
      hosts:
        bang-rhythm:
          ansible_host: "{{ bang_rhythm_ts_ip }}"
        bang-blues:
          ansible_host: "{{ bang_blues_ts_ip }}"
